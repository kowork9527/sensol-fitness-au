name: Temp Scrape
on:
  push:
    paths: ['scraper-targets.txt']
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape RSS feeds
        run: |
          mkdir -p scrape-output
          i=1
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            for n in 1 2 3; do
              curl -sL --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36" "$url" -o "scrape-output/r${i}.xml"
              if [ -s "scrape-output/r${i}.xml" ] && grep -q "<feed" "scrape-output/r${i}.xml"; then
                echo "r${i}.xml OK (attempt $n)"
                break
              fi
              echo "r${i}.xml attempt $n failed, retrying in 30s..."
              sleep 30
            done
            i=$((i+1))
            sleep 25
          done < <(tr -d '\r' < scraper-targets.txt)
      - name: Commit results
        run: |
          git config user.name "scrape-bot"
          git config user.email "scrape-bot@users.noreply.github.com"
          git add scrape-output/
          git diff --cached --quiet || (git commit -m "scrape output" && git push)
