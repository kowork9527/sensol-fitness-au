name: temp-scrape
on:
  workflow_dispatch:
    inputs:
      target_url:
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch URL
        run: curl -sL --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" "${{ github.event.inputs.target_url }}" -o result.json -w "HTTP:%{http_code} SIZE:%{size_download}B"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
          retention-days: 1
