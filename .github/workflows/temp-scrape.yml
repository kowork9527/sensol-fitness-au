name: Temp Scrape
on:
  push:
    paths:
      - 'scraper-targets.txt'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS feeds
        run: |
          mkdir -p scrape-output
          i=1
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            for n in 1 2 3; do
              curl -sL --max-time 30 -A "Mozilla/5.0" "$url" -o "scrape-output/r$i.xml"
              if [ -s "scrape-output/r$i.xml" ]; then break; fi
              echo "attempt $n failed for r$i"
              sleep 30
            done
            i=$((i+1))
            sleep 25
          done < <(tr -d '\r' < scraper-targets.txt)
      - name: Commit results
        run: |
          git config user.name "scrape-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scrape-output/
          git diff --cached --quiet || git commit -m "scrape output"
          git push
