<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensol RS03 - Product Page v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: #F7F4F0;
  color: #1A1816;
  line-height: 1.6;
}

.product-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 40px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: start;
}

/* Gallery */
.gallery {
  position: sticky;
  top: 40px;
}

.gallery__main {
  aspect-ratio: 1 / 1;
  background: #fff;
  overflow: hidden;
  margin-bottom: 16px;
  border: 1px solid #D4CEC6;
}

.gallery__main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.gallery__main:hover img {
  transform: scale(1.05);
}

.gallery__thumbs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.gallery__thumb {
  aspect-ratio: 1 / 1;
  background: #fff;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}

.gallery__thumb:hover,
.gallery__thumb.active {
  border-color: #1A1816;
}

.gallery__thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Product Info */
.product-info {
  padding: 20px 0;
}

.product-info__vendor {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #8A8279;
  margin-bottom: 16px;
}

.product-info__title {
  font-size: 48px;
  font-weight: 300;
  letter-spacing: 0.04em;
  line-height: 1.1;
  margin-bottom: 24px;
  color: #1A1816;
}

.product-info__price {
  font-size: 32px;
  font-weight: 400;
  color: #1A1816;
  margin-bottom: 32px;
  letter-spacing: 0.02em;
}

.product-info__price s {
  color: #8A8279;
  margin-right: 16px;
  font-size: 24px;
}

.product-info__stock {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 10px 20px;
  margin-bottom: 40px;
}

.product-info__stock--in {
  background: #E8F5E9;
  color: #2E7D32;
}

.product-info__stock--out {
  background: #FFEBEE;
  color: #C62828;
}

/* Quantity */
.quantity-selector {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 32px;
}

.quantity-selector__label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #8A8279;
  font-weight: 500;
}

.quantity-selector__input {
  width: 100px;
  padding: 14px;
  border: 1px solid #D4CEC6;
  background: #fff;
  font-size: 16px;
  text-align: center;
  font-family: 'Inter', sans-serif;
}

.quantity-selector__input:focus {
  outline: none;
  border-color: #1A1816;
}

/* Add to Cart */
.add-to-cart {
  width: 100%;
  padding: 22px;
  background: #1A1816;
  color: #F7F4F0;
  border: none;
  font-size: 13px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  margin-bottom: 24px;
}

.add-to-cart:hover {
  background: #2A2826;
}

.add-to-cart:disabled {
  background: #8A8279;
  cursor: not-allowed;
}

/* Payment Icons */
.payment-icons {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 20px 0;
  border-top: 1px solid #D4CEC6;
  border-bottom: 1px solid #D4CEC6;
  margin-bottom: 32px;
}

.payment-icon {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #8A8279;
  padding: 8px 16px;
  border: 1px solid #D4CEC6;
  background: #fff;
}

/* Share */
.share-buttons {
  display: flex;
  gap: 16px;
  justify-content: center;
}

.share-button {
  width: 44px;
  height: 44px;
  border: 1px solid #D4CEC6;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8A8279;
  text-decoration: none;
  font-size: 14px;
  transition: all 0.2s;
}

.share-button:hover {
  background: #1A1816;
  color: #F7F4F0;
  border-color: #1A1816;
}

/* Responsive */
@media (max-width: 968px) {
  .product-container {
    grid-template-columns: 1fr;
    gap: 40px;
    padding: 40px 20px;
  }
  
  .gallery {
    position: static;
  }
  
  .product-info__title {
    font-size: 36px;
  }
  
  .product-info__price {
    font-size: 28px;
  }
}

@media (max-width: 640px) {
  .product-info__title {
    font-size: 28px;
  }
  
  .product-info__price {
    font-size: 24px;
  }
  
  .gallery__thumbs {
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
}
</style>
</head>
<body>

<div class="product-container">
  <!-- Gallery -->
  <div class="gallery">
    <div class="gallery__main">
      <img src="https://cdn.shopify.com/s/files/1/1020/4263/2324/files/imgi_46_sensol.png?v=1785228479" alt="Sensol RS03">
    </div>
    <div class="gallery__thumbs">
      <div class="gallery__thumb active">
        <img src="https://cdn.shopify.com/s/files/1/1020/4263/2324/files/imgi_46_sensol.png?v=1785228479" alt="Sensol RS03 - View 1">
      </div>
      <div class="gallery__thumb">
        <img src="https://cdn.shopify.com/s/files/1/1020/4263/2324/files/imgi_46_sensol.png?v=1785228479" alt="Sensol RS03 - View 2">
      </div>
      <div class="gallery__thumb">
        <img src="https://cdn.shopify.com/s/files/1/1020/4263/2324/files/imgi_46_sensol.png?v=1785228479" alt="Sensol RS03 - View 3">
      </div>
      <div class="gallery__thumb">
        <img src="https://cdn.shopify.com/s/files/1/1020/4263/2324/files/imgi_46_sensol.png?v=1785228479" alt="Sensol RS03 - View 4">
      </div>
    </div>
  </div>

  <!-- Product Info -->
  <div class="product-info">
    <div class="product-info__vendor">SENSOL FITNESS</div>
    <h1 class="product-info__title">Sensol RS03</h1>
    
    <div class="product-info__price">
      <s>$4,200.00</s>
      $3,500.00 AUD
    </div>

    <div class="product-info__stock product-info__stock--in">In Stock</div>

    <div class="quantity-selector">
      <label class="quantity-selector__label" for="quantity">Quantity</label>
      <input class="quantity-selector__input" type="number" id="quantity" value="1" min="1">
    </div>

    <button class="add-to-cart">Add to Cart</button>

    <div class="payment-icons">
      <div class="payment-icon">PayPal</div>
      <div class="payment-icon">Afterpay</div>
      <div class="payment-icon">Shop Pay</div>
      <div class="payment-icon">Apple Pay</div>
      <div class="payment-icon">Google Pay</div>
    </div>

    <div class="share-buttons">
      <a href="#" class="share-button">f</a>
      <a href="#" class="share-button">ig</a>
      <a href="#" class="share-button">x</a>
      <a href="#" class="share-button">p</a>
      <a href="#" class="share-button">link</a>
    </div>
  </div>
</div>

<script>
// Thumbnail click handler
document.querySelectorAll('.gallery__thumb').forEach(thumb => {
  thumb.addEventListener('click', function() {
    document.querySelectorAll('.gallery__thumb').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    const img = this.querySelector('img');
    document.querySelector('.gallery__main img').src = img.src;
  });
});
</script>

</body>
</html>
